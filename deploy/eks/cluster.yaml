# Replace region and name before provisioning. This creates billable resources.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: product-platform
  region: ap-south-1
iam:
  withOIDC: true
managedNodeGroups:
  - name: cpu-apps
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 40
    volumeType: gp3
    # Public nodes avoid NAT gateway charges; no SSH access is enabled.
    privateNetworking: false
